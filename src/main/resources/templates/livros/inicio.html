<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Bem-vindo ao Sistema de Biblioteca</h1>

<nav>
    <ul>
        <li><a th:href="@{/livros}">Livros</a></li>
        <li><a th:href="@{/autores}">Autores</a></li>
        <li><a th:href="@{/categorias}">Categorias</a></li>
        <li><a th:href="@{/usuarios}">Usuários</a></li>
        <li><a th:href="@{/emprestimos}">Empréstimos</a></li>
    </ul>
</nav>

<hr>

<h2>Cadastrar Livro</h2>
<form th:action="@{/livros}" th:object="${livro}" method="post">
    <div>
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" th:field="*{titulo}" required>
    </div>

    <div>
        <label for="isbn">ISBN:</label>
        <input type="text" id="isbn" th:field="*{isbn}">
    </div>

    <!-- Aqui você pode expandir depois para autor/categoria conforme os atributos da sua classe Livro -->
    <button type="submit">Salvar</button>
</form>

<hr>

<h2>Livros Cadastrados</h2>
<table>
    <thead>
    <tr>
        <th>Título</th>
        <th>ISBN</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${livros}">
        <td th:text="${item.titulo}"></td>
        <td th:text="${item.isbn}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
